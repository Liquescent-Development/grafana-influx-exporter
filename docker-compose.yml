services:
  grafana-influx-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafana-influx-exporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Grafana authentication - choose one method
      - GRAFANA_TOKEN=${GRAFANA_TOKEN:-}                    # Service account token (recommended)
      - GRAFANA_USERNAME=${GRAFANA_USERNAME:-}              # Basic auth username
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD:-}              # Basic auth password
      
      # Optional configuration overrides
      - CONFIG_PATH=${CONFIG_PATH:-/app/config.yaml}
      - LOG_LEVEL=${LOG_LEVEL:-debug}  # Set to debug by default for troubleshooting
      - METRICS_PORT=${METRICS_PORT:-8080}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus to scrape the exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - grafana-influx-exporter

  # Grafana for visualizing the monitoring data
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-config:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: